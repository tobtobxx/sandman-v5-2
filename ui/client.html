<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f3ef; --side: #ecebe5; --panel: #ffffff; --head: #f8f7f3; --ink: #1c1d21; --muted: #63646b; --line: #dedcd4;
  --accent: #2f4fc4; --accent-ink: #1f3796; --accent-soft: #dfe5f9; --on-accent: #ffffff;
  --warn: #9a3d0c; --warn-soft: #fbeee3; --warn-line: #edcdb5; --badge: #b4480f;
  --ok: #2b7a4b; --ok-soft: #e3f2e8; --ok-line: #bcdcc7; --chip: #e9e7e0;
  --lane-queue: #6b5bb5; --lane-queue-soft: #ece9f6; --lane-stop: #b3363a; --lane-stop-soft: #f6e6e6;
  --sans: "Instrument Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16171a; --side: #1c1d21; --panel: #222328; --head: #1e1f23; --ink: #ecebe7; --muted: #9b9ca3; --line: #33343a;
  --accent: #8ea2ff; --accent-ink: #b4c2ff; --accent-soft: #262d4a; --on-accent: #10121c;
  --warn: #f5a36d; --warn-soft: #3a2518; --warn-line: #5a3a24; --badge: #d9642a;
  --ok: #7fd09c; --ok-soft: #1b3024; --ok-line: #2d4d38; --chip: #2b2c31;
  --lane-queue: #b3a6f0; --lane-queue-soft: #29253d; --lane-stop: #f08a8d; --lane-stop-soft: #3a1f21; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16171a; --side: #1c1d21; --panel: #222328; --head: #1e1f23; --ink: #ecebe7; --muted: #9b9ca3; --line: #33343a;
  --accent: #8ea2ff; --accent-ink: #b4c2ff; --accent-soft: #262d4a; --on-accent: #10121c;
  --warn: #f5a36d; --warn-soft: #3a2518; --warn-line: #5a3a24; --badge: #d9642a;
  --ok: #7fd09c; --ok-soft: #1b3024; --ok-line: #2d4d38; --chip: #2b2c31;
  --lane-queue: #b3a6f0; --lane-queue-soft: #29253d; --lane-stop: #f08a8d; --lane-stop-soft: #3a1f21; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: var(--accent); text-decoration: none; } a:hover { color: var(--accent-ink); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: flex; height: 100%; }
/* sidebar */
aside { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 18px 14px; overflow-y: auto; }
.brand { padding: 0 8px; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
.brand a { font: 500 12px var(--sans); color: var(--muted); }
.home-btn { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; color: var(--accent-ink); font-weight: 600; font-size: 14px; border: 1px solid var(--accent-soft); }
.home-btn.on { background: var(--accent-soft); }
.meta { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.navlist { display: flex; flex-direction: column; gap: 2px; }
.navlist a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink); font-size: 14px; }
.navlist a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navlist a:hover { background: var(--chip); }
.navlist a.on { background: var(--accent-soft); font-weight: 600; }
.navlist a.conv span:first-child { color: var(--muted); }
.badge { background: var(--badge); color: #fff; border-radius: 9px; font-size: 11px; padding: 1px 7px; font-weight: 600; flex-shrink: 0; }
.newtag { font-size: 11px; font-weight: 600; color: var(--ok); flex-shrink: 0; }
.side-bottom { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.side-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 12px; color: var(--muted); }
.side-foot select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
/* main */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; }
.center { max-width: 760px; margin: 0 auto; padding-inline: 24px; }
.menu-btn { display: none; }
@media (max-width: 820px) {
  aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  aside.open { transform: none; }
  .menu-btn { display: inline-flex; position: fixed; top: 10px; left: 10px; z-index: 5; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; }
  .center { padding-inline: 16px; }
}
/* home */
.home { padding-block: 12vh 40px; display: flex; flex-direction: column; gap: 36px; }
.home h1 { margin: 6px 0 14px; font-size: clamp(26px, 4vw, 34px); font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(40, 38, 30, 0.07); }
.composer textarea { border: 0; outline: none; resize: vertical; min-height: 110px; font-size: 18px; line-height: 1.5; background: transparent; }
.composer-row { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn:disabled { opacity: .55; cursor: default; }
.hint { flex: 1; font-size: 13px; color: var(--muted); }
.send-btn { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 20px; background: var(--accent); color: var(--on-accent); font-weight: 600; border: 0; }
.send-btn:disabled { opacity: .6; cursor: default; }
.twocol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 640px) { .twocol { grid-template-columns: 1fr; } }
.qrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink); }
.qrow span:last-child { color: var(--muted); white-space: nowrap; }
.qrow:hover { color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
/* send result */
.sendview { padding-block: 48px; display: flex; flex-direction: column; gap: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.itemcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.itemcard.new { border: 2px solid var(--ok); padding: 15px; }
.itemcard h2 { margin: 0; font-size: 18px; font-weight: 600; }
.quote { margin: 0; font-size: 14px; color: var(--muted); font-style: italic; }
.go { display: flex; justify-content: center; align-items: center; height: 40px; border-radius: 20px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; margin-top: auto; }
.go:hover { color: var(--on-accent); filter: brightness(1.08); }
/* topic */
.topic-head { padding: 16px 32px 12px 32px; border-bottom: 1px solid var(--line); background: var(--head); display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 820px) { .topic-head { padding-left: 64px; } }
.topic-head .row1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.topic-head h1 { margin: 0; font-size: 21px; font-weight: 600; }
.topic-head .sum { font-size: 13px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.chip { padding: 2px 10px; border-radius: 12px; background: var(--chip); color: var(--muted); }
.chip.run { background: var(--accent-soft); color: var(--accent-ink); }
.chip.q { background: var(--warn-soft); color: var(--warn); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.timeline { padding: 20px 32px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; justify-content: flex-end; }
@media (max-width: 640px) { .timeline { padding: 16px; } }
.day { align-self: center; }
.me { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: min(600px, 85%); }
.me .b { background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-wrap: break-word; }
.me.fresh .b { box-shadow: 0 0 0 3px var(--accent-soft); }
.sub { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.sm { align-self: flex-start; max-width: min(660px, 90%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 11px 15px; white-space: pre-wrap; word-wrap: break-word; }
.receipt { align-self: flex-start; display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
.receipt .line { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--muted); }
.receipt .line span { min-width: 0; }
.receipt .line svg { margin-top: 3px; }
.receipt .line .linkbtn { margin-left: 6px; }
.receipt .line.undone { text-decoration: line-through; }
.receipt svg { color: var(--ok); flex-shrink: 0; }
.workcard { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.workcard b { font-weight: 600; }
.workcard .st { white-space: nowrap; }
.st.running, .st.verifying, .st.new, .st.ready, .st.waiting { color: var(--accent-ink); }
.st.done { color: var(--ok); } .st.blocked, .st.failed { color: var(--warn); } .st.cancelled { color: var(--muted); }
.question { align-self: flex-start; max-width: min(620px, 92%); background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 16px 16px 16px 4px; padding: 12px 15px; display: flex; flex-direction: column; gap: 10px; }
.question.answered { background: var(--panel); border-color: var(--line); }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { border: 1px solid var(--warn-line); background: var(--panel); border-radius: 18px; padding: 5px 13px; font-size: 14px; }
.opt:hover { border-color: var(--warn); }
.qform { display: flex; gap: 6px; }
.qform input { flex: 1; min-width: 0; border: 1px solid var(--warn-line); border-radius: 8px; padding: 4px 8px; background: var(--panel); font-size: 14px; }
.result { align-self: flex-start; max-width: min(660px, 92%); background: var(--ok-soft); border: 1px solid var(--ok-line); border-radius: 16px 16px 16px 4px; padding: 11px 15px; display: flex; flex-direction: column; gap: 6px; }
.result.failed, .result.cancelled { background: var(--panel); border-color: var(--line); }
.result .txt { white-space: pre-wrap; }
.reminder { align-self: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 9px 14px; }
.system { align-self: center; font-size: 13px; color: var(--muted); }
.working { align-self: flex-start; font-size: 13px; color: var(--accent); display: flex; gap: 8px; align-items: center; }
.dots::after { content: "…"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } aside { transition: none; } }
.chatbar { padding: 12px 32px 18px; }
@media (max-width: 640px) { .chatbar { padding: 10px 12px 14px; } }
.chatbar form { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 7px 7px 7px 14px; }
.chatbar input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; }
.mover { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.mover select { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 13px; padding: 2px 4px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; }
.linkbtn:hover { color: var(--accent-ink); }
/* secondary views */
.page { padding-block: 32px 48px; display: flex; flex-direction: column; gap: 16px; }
.page h1 { margin: 0; font-size: 24px; font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
/* board */
.board-page { padding: 32px 32px 40px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
@media (max-width: 820px) { .board-page { padding: 56px 16px 32px; } }
.board-page h1 { margin: 0; font-size: 24px; font-weight: 600; }
.board-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.board-head .meta { text-transform: none; letter-spacing: 0; font-size: 12px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.lane { --c: var(--muted); --c-soft: var(--chip); background: var(--c-soft); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 12px; display: flex; flex-direction: column; min-height: 240px; }
.lane.queued { --c: var(--lane-queue); --c-soft: var(--lane-queue-soft); }
.lane.active { --c: var(--accent); --c-soft: var(--accent-soft); }
.lane.attention { --c: var(--badge); --c-soft: var(--warn-soft); }
.lane.done { --c: var(--ok); --c-soft: var(--ok-soft); }
.lane.stopped { --c: var(--lane-stop); --c-soft: var(--lane-stop-soft); }
.lane-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 8px; }
.lane-head b { font-size: 14px; font-weight: 600; }
.lane-head .n { min-width: 24px; text-align: center; background: var(--c); color: var(--panel); border-radius: 10px; font: 600 12px var(--mono); padding: 1px 7px; }
.lane-body { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 10px; }
.lane-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 10px; text-align: center; font-size: 13px; color: var(--muted); }
.bcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--sc, var(--c)); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; box-shadow: 0 1px 2px rgba(40, 38, 30, 0.05); }
.bcard .t { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.bcard .sum { font-size: 13px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.bcard .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.bcard .m .ago { margin-left: auto; white-space: nowrap; }
.bcard .why { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 8px; overflow-wrap: anywhere; }
.bcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.bcard .foot > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .foot a { color: var(--muted); } .bcard .foot a:hover { color: var(--accent); }
.bcard .acts { display: flex; gap: 4px; flex-shrink: 0; }
.bcard .acts .btn { padding: 2px 9px; font-size: 12px; }
.sp { font: 500 11px var(--mono); padding: 1px 7px; border-radius: 9px; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); }
.s-new, .s-ready { --sc: var(--lane-queue); }
.s-running, .s-verifying { --sc: var(--accent); }
.s-waiting, .s-blocked { --sc: var(--badge); }
.s-done { --sc: var(--ok); }
.s-failed { --sc: var(--lane-stop); } .s-cancelled { --sc: var(--muted); }
.qdetails { font-size: 13px; line-height: 1.45; display: grid; gap: 6px; }
.qdetails ul { margin: 2px 0 0; padding-left: 18px; } .qdetails li { margin: 2px 0; }
.qdetails .draft { white-space: pre-wrap; max-height: 9.5em; overflow: auto; padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
/* clickable cards + card details */
.cardlink { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cardlink:hover { color: var(--accent-ink); }
[data-card], [data-go] { cursor: pointer; }
.bcard[data-card], .workcard[data-card], .itemcard[data-go] { transition: border-color .12s, box-shadow .12s; }
.bcard[data-card]:hover, .workcard[data-card]:hover, .itemcard[data-go]:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(40, 38, 30, 0.09); }
.bcard[data-card]:hover { border-left-color: var(--sc, var(--c)); }
.result[data-card]:hover { box-shadow: 0 0 0 2px var(--ok-line); }
button.chip { border: 0; font: inherit; cursor: pointer; } button.chip:hover { filter: brightness(0.96); }
.workcard .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.carddlg { width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.carddlg::backdrop { background: rgba(20, 20, 24, .38); }
.cd { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 20px; }
.cd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cd-head h2 { margin: 2px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.cd-head .icon-btn { width: 32px; height: 32px; font-size: 18px; }
.cd .m { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.cd section { display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.cd section > .meta { padding-bottom: 2px; }
.cd ul { margin: 0; padding-left: 18px; } .cd li { margin: 2px 0; overflow-wrap: anywhere; }
.cd .why { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.cd .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.cd .row { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cd .row > :first-child { min-width: 0; overflow-wrap: anywhere; }
.cd .row .sp, .cd .row .when { flex-shrink: 0; }
.cd .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.cd .hist { font-size: 13px; }
.cd .acts { display: flex; gap: 6px; flex-wrap: wrap; }
/* all topics */
.search { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); font-size: 15px; width: 100%; }
.trow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
.trow:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.trow .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.trow .tt a { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.trow.archived .tt a { color: var(--muted); }
.trow .tm { font-size: 12px; color: var(--muted); }
.trow .ts { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .btn { flex-shrink: 0; }
.trow[hidden] { display: none; }
.fact { display: flex; gap: 8px; align-items: baseline; font-size: 14px; flex-wrap: wrap; }
.fact span:first-child { flex: 1; min-width: 200px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="Open topics">☰</button>
<div class="app">
  <aside id="side">
    <div class="brand"><span>Sandman</span><a href="/observer">observer</a></div>
    <a class="home-btn" href="#home" id="homeBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Home · new message
    </a>
    <div class="meta" style="padding: 0 10px">Topics</div>
    <nav class="navlist" id="topics"></nav>
    <div class="side-bottom navlist" id="secondary"></div>
    <div class="side-foot"><label for="mode">Mode</label>
      <select id="mode"><option>active</option><option>driving</option><option>dnd</option></select></div>
  </aside>

<script>

  const acts = [
    ["blocked", "failed"].includes(c.state) ? `<button class="btn" data-retry="${c.id}">Retry</button>` : "",
    !["done", "failed", "cancelled"].includes(c.state) ? `<button class="btn" data-cancel="${c.id}">Cancel</button>` : "",
    topic ? `<a class="btn" href="#topic/${topic.id}">Open topic</a>` : "",
  ].join("");
  const result = r ? [
    r.summary ? `<div class="txt">${esc(r.summary)}</div>` : "",
    r.items?.length ? ul(r.items, (i) => `<b>${esc(i.name)}</b>${i.note ? ` · ${esc(i.note)}` : ""}`) : "",
    r.recommendation ? `<div><b>Recommendation:</b> ${esc(r.recommendation)}</div>` : "",
    r.facts?.length ? `<div><b>Facts</b>${ul(r.facts, (f) => esc(f.claim ?? f))}</div>` : "",
    r.open_questions?.length ? `<div><b>Open questions</b>${ul(r.open_questions)}</div>` : "",
    r.sources?.length ? `<div><b>Sources</b>${ul(r.sources, srcLink)}</div>` : "",
  ].join("") : "";
  return `<div class="cd">
    <div class="cd-head"><div><div class="meta">${c.kind !== "task" ? esc(c.kind[0].toUpperCase() + c.kind.slice(1)) : `${c.depth ? "Part of a task" : "Task"} · ${esc(c.role)}`}</div><h2 id="cardDlgTitle">${esc(c.title)}</h2></div>
      <button class="icon-btn" data-close aria-label="Close">×</button></div>
    <div class="m s-${c.state}"><span class="sp">${esc(c.state)}</span>${d.children.length ? `<span>${done} of ${d.children.length} parts done</span>` : ""}${c.attempt > 1 ? `<span>try ${c.attempt}</span>` : ""}
      <span>created ${esc(ago(c.created_at))}</span>${c.updated_at && c.updated_at !== c.created_at ? `<span>updated ${esc(ago(c.updated_at))}</span>` : ""}${c.due_at ? `<span>due ${esc(when(c.due_at))}</span>` : ""}
      ${topic ? `<span>in <a href="#topic/${topic.id}">${esc(topic.title)}</a></span>` : ""}</div>
    ${c.state === "blocked" && c.blocked_reason ? `<div class="why">${esc(c.blocked_reason)}</div>` : ""}
    ${c.parent_id ? `<div style="font-size:13px">Part of <button class="linkbtn" data-card="${c.parent_id}">the parent task</button></div>` : ""}
    ${sect("Goal", `<div class="txt">${esc(c.goal)}</div>${c.original_goal && c.original_goal !== c.goal ? `<div style="font-size:13px;color:var(--muted)">Originally: ${esc(c.original_goal)}</div>` : ""}`)}
    ${sect("Done when", c.done_when.length ? ul(c.done_when) : "")}
    ${sect("Constraints", c.constraints.length ? ul(c.constraints) : "")}
    ${sect(c.state === "done" ? "Result" : "Latest result", result)}
    ${sect("Parts", d.children.map((k) => `<div class="row s-${k.state}"><button class="cardlink" data-card="${k.id}">${esc(k.title)}</button><span class="sp">${esc(k.state)}</span></div>`).join(""))}
    ${sect("Files", d.artifacts.map((a) => `<div class="row"><button class="linkbtn" data-art="${a.id}">${esc(a.name)}</button><span class="when">${a.bytes ? `${Math.max(1, Math.round(a.bytes / 1024))} KB` : ""}</span></div>`).join(""))}
    ${sect("Questions", d.questions.map((q) => `<div class="row"><span>${esc(q.text)}${q.status === "answered" ? `<br><span style="color:var(--muted);font-size:13px">Answered: ${esc(q.answer_option ?? q.answer_text ?? "")}</span>` : ""}</span>
      ${q.status === "open" && q.topic_id ? `<a class="when" href="#topic/${q.topic_id}">Answer</a>` : `<span class="when">${esc(q.status)}</span>`}</div>`).join(""))}
    <section><div class="meta">Comments</div>
      ${d.comments.map((m) => `<div class="row"><span><b>${m.author === "owner" ? "You" : esc(m.author)}</b> ${esc(m.body)}</span><span class="when">${esc(ago(m.created_at))}</span></div>`).join("")}
      <form class="qform" id="cardComment"><input aria-label="Comment on this card" placeholder="Add a comment for the worker…" style="border-color:var(--line)"><button class="btn">Comment</button></form></section>
    ${sect("History", d.events.length ? `<details class="hist"><summary>${d.events.length} step${d.events.length > 1 ? "s" : ""}</summary>${d.events.map((e) => `<div class="row"><span>${e.from_state ? `${esc(e.from_state)} → ` : ""}<b>${esc(e.to_state)}</b> · ${esc(e.event)}${e.actor ? ` <span style="color:var(--muted)">(${esc(e.actor)})</span>` : ""}</span><span class="when">${esc(when(e.at))}</span></div>`).join("")}</details>` : "")}
    ${acts ? `<div class="acts">${acts}</div>` : ""}
  </div>`;
}
async function refreshCard() {
  const dlg = $("#cardDlg"), id = cardOpen;
  if (!id) return;
  const input = $("#cardComment input", dlg), typed = input?.value ?? "", focused = document.activeElement === input;
  const open = $(".hist", dlg)?.open;
  let html;
  try { html = cardView(await api(`/cards/${id}`)); }
  catch (err) { html = `<div class="cd"><div class="cd-head"><h2 id="cardDlgTitle">Could not load this card</h2><button class="icon-btn" data-close aria-label="Close">×</button></div><p>${esc(err.message)}</p></div>`; }
  if (cardOpen !== id) return;
  dlg.innerHTML = html;
  const inp = $("#cardComment input", dlg);
  if (inp) { inp.value = typed; if (focused) inp.focus(); }
  if (open) $(".hist", dlg).open = true;
}
async function openCard(id) {
  const dlg = $("#cardDlg");
  cardOpen = id;
  await refreshCard();
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  $("[data-close]", dlg)?.focus();
}
$("#cardDlg").addEventListener("close", () => { cardOpen = null; });
$("#cardDlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); }); // backdrop
let memq = "";
function consolidationLine(st) {
  const counts = Object.entries(st.last_counts ?? {}).map(([k, n]) => `${n} ${k}`).join(", ");
  const last = st.running ? `Consolidating since ${time(st.started_at)}…`
    : st.last_completed_at ? `Last consolidated ${when(st.last_completed_at)}${counts ? ` (${counts})` : ""}` : "Never consolidated";
  return `${last} · ${st.pending} pending`;
}
async function viewMemory() {
  const [ns, st] = await Promise.all([api(`/memory/notes${memq ? `?query=${encodeURIComponent(memq)}` : ""}`), api("/memory/status")]);
  return `<div class="scroll"><div class="center page"><h1>Memory</h1>
    <form id="memq" style="display:flex;gap:6px"><input aria-label="Search notes" value="${esc(memq)}" placeholder="Search notes" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--panel)"><button class="btn">Search</button><button class="btn" type="button" id="consolidate"${st.running ? " disabled" : ""}>${st.running ? "Consolidating…" : "Consolidate now"}</button></form>
    <div style="color:var(--muted);font-size:12px;margin:6px 0 10px">${esc(consolidationLine(st))}</div>
    ${ns.map((n) => `<div class="panel"><div><b>${esc(n.title)}</b> <span style="color:var(--muted);font-size:12px">${n.status === "pending" ? "pending · not consolidated yet" : n.kind}</span></div>
      ${n.claims.map((c) => `<div class="fact"><span${c.pending ? ` style="color:var(--muted)"` : ""}>${esc(c.text)}${c.stale ? ` <i style="color:var(--muted)">(may be outdated)</i>` : ""}</span><span style="color:var(--muted);font-size:12px">${String(c.observed_at).slice(0, 10)} · ${c.volatility}</span>${c.pending ? "" : `<button class="btn" data-retract="${c.id}">Retract</button>`}</div>`).join("")}</div>`).join("") || `<div class="empty">${memq ? "Nothing matches." : "Memory is empty."}</div>`}</div></div>`;
}

// ---------------------------------------------------------------- question drafts
// Live updates replace the whole view, so answers typed into a question card are kept here
// (keyed by question id) and put back, with focus and caret, after each render.
const qDrafts = new Map();
const qInput = (el) => el?.matches?.(".qform input") ? el.closest("[data-q]") : null;
document.addEventListener("input", (e) => { const q = qInput(e.target); if (q) qDrafts.set(q.dataset.q, e.target.value); });
function qFocus() {
  const el = document.activeElement, q = qInput(el);
  return q ? { id: q.dataset.q, start: el.selectionStart, end: el.selectionEnd } : null;
}
function restoreQDrafts(focus) {
  for (const q of document.querySelectorAll("#main [data-q]")) {
    const input = $(".qform input", q);
    if (!input) continue;
    if (qDrafts.has(q.dataset.q)) input.value = qDrafts.get(q.dataset.q);
    if (focus?.id === q.dataset.q) { input.focus(); input.setSelectionRange(focus.start, focus.end); }
  }
}

// ---------------------------------------------------------------- render
let rendering = null;
async function render(navigated = false, keepFocus = false) {
  if (rendering) { rendering.again = true; return; }
  rendering = { again: false };
  try {
    const r = route();
    const home = await sidebar();
    const main = $("#main");
    // Swaps in a view's html, keeping answers typed into question cards (and their focus).
    const swap = (html) => { const qf = navigated ? null : qFocus(); main.innerHTML = html; restoreQDrafts(qf); };
    if (r.view === "home") { if (navigated || !$("#prompt")) { main.innerHTML = viewHome(home); bindHome(); } }
    else if (r.view === "send") swap(await viewSend(r.id));
    else if (r.view === "topic") {
      const html = await viewTopic(r.id);
      const focused = keepFocus || (document.activeElement && document.activeElement.id === "chatIn");
      swap(html); bindTopic(r.id, focused || navigated);
    }
    else if (r.view === "needs") {
      const html = await viewNeeds();
      const el = document.activeElement, inBf = !!el?.closest?.("#bf"), bf = el?.matches?.("#bf input") ? [el.selectionStart, el.selectionEnd] : null;
      swap(html);
      const input = $("#bf input");
      if (input && (inBf || navigated || keepFocus)) { input.focus(); input.setSelectionRange(...(bf ?? [input.value.length, input.value.length])); }
    }
    else if (r.view === "review") swap(await viewReview());
    else if (r.view === "board") swap(await viewBoard());
    else if (r.view === "memory") swap(await viewMemory());
    else if (r.view === "all") {
      const el = document.activeElement, caret = el?.id === "allq" ? [el.selectionStart, el.selectionEnd] : null;
      swap(await viewAll()); filterAll();
      if (caret || navigated) { const q = $("#allq"); q.focus(); q.setSelectionRange(...(caret ?? [q.value.length, q.value.length])); }
    }
    else { location.hash = "home"; }
    if (cardOpen) await refreshCard();
    if (navigated) api("/presence", { mode: $("#mode").value, topic_id: r.view === "topic" ? r.id : null }).catch(() => {});
  } catch (err) {
    $("#main").innerHTML = `<div class="center page"><h1>Could not load this view</h1><p>${esc(err.message)}</p><a href="#home">Back to home</a></div>`;
  } finally {
    const again = rendering.again; rendering = null;
    if (again) render();
  }
}

// ---------------------------------------------------------------- actions (delegated)
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a");
  if (!t) {
    // A click anywhere else on a card opens it, unless it ends a text selection or lands in a form.
    const box = e.target.closest("[data-card], [data-go]");
    if (!box || e.target.closest("form, input, select, textarea, summary") || String(getSelection()).trim()) return;
    if (box.dataset.go) location.hash = box.dataset.go;
    else openCard(box.dataset.card);
    return;
  }
  const d = t.dataset;
  try {
    if (d.card) openCard(d.card);
    else if (d.close !== undefined) $("#cardDlg").close();
    else if (d.undo) { const r = await api(`/receipts/${d.undo}/undo`, {}); toast(r.note ?? "Undone"); render(); }
    else if (d.opt !== undefined) { const q = t.closest("[data-q]").dataset.q; await api(`/questions/${q}/answer`, { option: Number(d.opt) }); qDrafts.delete(q); render(); }
    else if (d.moveOpen !== undefined) {
      const box = t.closest("[data-mover]");
      box.innerHTML = `<label for="mv-${box.dataset.mover}">Move to</label><select id="mv-${box.dataset.mover}">${topicsCache.filter((x) => x.kind !== "conversation").map((x) => `<option value="${x.id}">${esc(x.title)}</option>`).join("")}<option value="new">A new topic</option></select><button class="linkbtn" data-move-go>Move</button><button class="linkbtn" data-move-cancel>Cancel</button>`;
    }
    else if (d.moveCancel !== undefined) render();
    else if (d.moveGo !== undefined) {
      const box = t.closest("[data-mover]");
      const topic = await api(`/items/${box.dataset.mover}/move`, { topic_id: box.querySelector("select").value });
      toast(`Moved to ${topic.title}`); location.hash = `topic/${topic.id}`; render();
    }
    else if (d.art) { const a = await api(`/artifacts/${d.art}`); const w = window.open("", "_blank"); if (w) w.document.body.innerHTML = `<pre style="white-space:pre-wrap;font:14px system-ui">${esc(a.content)}</pre>`; }
    else if (d.cancel) { await api(`/cards/${d.cancel}/cancel`, {}); render(); }
    else if (d.retry) { await api(`/cards/${d.retry}/retry`, {}); render(); }
    else if (d.unarchive) { await api(`/topics/${d.unarchive}/unarchive`, {}); toast("Unarchived"); render(); }
    else if (d.retract) { await api("/memory/retract", { claim_id: d.retract }); render(); }
    else if (d.act) { const id = t.closest("[data-rev]").dataset.rev; await api(`/review/${id}/${d.act}`, {}); render(); }
    else if (t.id === "consolidate") { t.disabled = true; const s = await api("/memory/consolidate", {}); if (!s.started) toast("Already consolidating"); render(); }
    else if (t.id === "brief") briefStart();
  } catch (err) { toast(err.message); }
});
document.addEventListener("submit", async (e) => {
  const q = e.target.closest("[data-q]");
  if (q && e.target.classList.contains("qform")) {
    e.preventDefault();
    const text = e.target.querySelector("input").value.trim();
    if (text) { try { await api(`/questions/${q.dataset.q}/answer`, { text }); qDrafts.delete(q.dataset.q); } catch (err) { toast(err.message); } render(); }
  }
  if (e.target.id === "cardComment") {
    e.preventDefault();
    const input = e.target.querySelector("input"), text = input.value.trim();
    if (!text || !cardOpen) return;
    try { await api(`/cards/${cardOpen}/comment`, { text }); input.value = ""; await refreshCard(); } catch (err) { toast(err.message); }
  }
  if (e.target.id === "bf") {
    e.preventDefault();
    const text = e.target.querySelector("input").value.trim();
    if (text && briefing && !briefing.ended) briefReply(text);
  }
  if (e.target.id === "memq") { e.preventDefault(); memq = e.target.querySelector("input").value; render(); }
});
async function briefStart() {
  const b = await api("/briefings", {});
  // A briefing with nothing to ask runs straight through to its closing line.
  briefing = { id: b.id, log: [{ text: b.prompt.text }], ended: b.prompt.text.endsWith("That's all."), draft: "" };
  render(false, true);
}
async function briefReply(text) {
  const b = briefing;
  b.draft = "";
  b.log.push({ said: text, text: "…" });
  render();
  const line = b.log.at(-1);
  try {
    const r = await api(`/briefings/${b.id}/reply`, { text });
    line.text = r.text; if (r.ended) b.ended = true;
  } catch (err) { b.log.pop(); b.draft = text; toast(err.message); }
  if (briefing === b) render();
}
document.addEventListener("input", (e) => { if (briefing && e.target.closest?.("#bf")) briefing.draft = e.target.value; });

// ---------------------------------------------------------------- live updates
let pending = null;
const later = (ms = 250) => { clearTimeout(pending); pending = setTimeout(() => render(), ms); };
const es = new EventSource(`/events/stream?after=-1`);
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  const r = route();
  if (r.view === "topic" && ev.topic_id && ev.topic_id !== r.id && !/^topic\./.test(ev.type)) { if (/question\.|message\.created/.test(ev.type)) later(800); return; }
  later(r.view === "home" ? 800 : 250);
  if (ev.notify === "push" && document.hidden && "Notification" in window && Notification.permission === "granted") new Notification("Sandman", { body: ev.payload?.body ?? ev.payload?.text ?? ev.type });
};
if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
render(true);
</script>
</body>
</html>

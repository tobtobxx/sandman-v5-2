# Android app (android/, docs/ANDROID.md): format, lint, unit tests and a debug APK.
# Runs only when the app or this workflow changes.
name: android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Validates the Gradle wrapper and caches Gradle; the runner image has the Android SDK.
      # basic: the open-source cache on actions/cache, not the commercial default.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - run: ./gradlew spotlessCheck
      - run: ./gradlew lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

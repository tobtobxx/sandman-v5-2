# Runs the hard bench set once per PR (docs/BENCH.md, "CI"). About $0.0075 per run.
# Needs the repository secret OPENROUTER_API_KEY.
name: bench

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - name: Write config.jsonc
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::The OPENROUTER_API_KEY secret is not set (secrets are not passed to PRs from forks)."
            exit 1
          fi
          jq -n --arg key "$OPENROUTER_API_KEY" '{api_key: $key}' > config.jsonc
      - name: Hard set, fail below 90 % (more than 2 of 23 cases)
        run: deno task bench --no-save --min-pass 90
